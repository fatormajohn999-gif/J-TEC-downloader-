name: Build Android Debug APK (Capacitor)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Initialize / Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          # Copy custom native Kotlin plugin files to the generated android project
          PLUGIN_DIR="android/app/src/main/java/com/omnidrop/app/plugin"
          mkdir -p "$PLUGIN_DIR"
          cp -r app/android-native/*.kt "$PLUGIN_DIR/" || true

          # Merge permissions and activity/service configurations into AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # Ensure SYSTEM_ALERT_WINDOW and foreground service permissions
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"
          fi

          npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew || true

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnidrop-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
