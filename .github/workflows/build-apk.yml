name: Build Android Debug APK (Capacitor)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Ensure Persistent Signing Key
        run: |
          mkdir -p signing
          if [ ! -f signing/omnidrop-debug.keystore ]; then
            keytool -genkeypair -v -keystore signing/omnidrop-debug.keystore \
              -storepass omnidrop123 -keypass omnidrop123 -alias omnidrop \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=OmniDrop, O=OmniDrop, C=SL"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signing/omnidrop-debug.keystore
            git commit -m "Add persistent signing key for OmniDrop APK updates"
            git push
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          CAP_VERSION=$(node -p "require('./node_modules/@capacitor/core/package.json').version")
          echo "Capacitor core version: $CAP_VERSION"
          npm install --no-save --no-audit --no-fund --legacy-peer-deps "@capacitor/android@$CAP_VERSION"

      - name: Build Web App
        run: npm run build

      - name: Create Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Add Native Kotlin Plugin
        run: |
          PKG_DIR="android/app/src/main/java/com/omnidrop/app"
          mkdir -p "$PKG_DIR/plugin"
          cp app/android-native/*.kt "$PKG_DIR/plugin/"

          # Replace MainActivity so it registers our plugin
          rm -f "$PKG_DIR/MainActivity.java" "$PKG_DIR/MainActivity.kt"
          cat > "$PKG_DIR/MainActivity.java" <<'JAVA'
          package com.omnidrop.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          import com.omnidrop.app.plugin.VideoDownloaderPlugin;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(VideoDownloaderPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          sed -i 's/^          //' "$PKG_DIR/MainActivity.java"

      - name: Patch Manifest and Enable Kotlin
        run: |
          python3 - <<'PY'
          import re

          # ---- AndroidManifest.xml ----
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          perms = (
              '    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />\n'
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
              '    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n'
              '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n'
          )
          comps = (
              '        <service android:name="com.omnidrop.app.plugin.FloatingBubbleService" android:enabled="true" android:exported="false" android:foregroundServiceType="specialUse">\n'
              '            <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="floating_quick_download_bubble" />\n'
              '        </service>\n'
              '        <activity android:name="com.omnidrop.app.plugin.ClipboardBridgeActivity" android:theme="@android:style/Theme.Translucent.NoTitleBar" android:excludeFromRecents="true" android:launchMode="singleTask" android:exported="false" />\n'
              '        <activity android:name="com.omnidrop.app.plugin.VideoPlayerActivity" android:exported="false" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen" android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize" />\n'
              '        <activity android:name="com.omnidrop.app.plugin.ShareActivity" android:exported="true" android:theme="@android:style/Theme.Translucent.NoTitleBar">\n'
              '            <intent-filter>\n'
              '                <action android:name="android.intent.action.SEND" />\n'
              '                <category android:name="android.intent.category.DEFAULT" />\n'
              '                <data android:mimeType="text/plain" />\n'
              '            </intent-filter>\n'
              '        </activity>\n'
          )
          if "FloatingBubbleService" not in s:
              s = s.replace("<application", perms + "    <application", 1)
              s = s.replace("</application>", comps + "    </application>", 1)
          open(p, "w").write(s)

          # ---- Kotlin support in Gradle ----
          p = "android/build.gradle"
          s = open(p).read()
          if "kotlin-gradle-plugin" not in s:
              s = re.sub(
                  r"(classpath ['\"]com\.android\.tools\.build:gradle:[^'\"]+['\"])",
                  r"\1\n        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0'",
                  s, count=1)
          open(p, "w").write(s)

          p = "android/app/build.gradle"
          s = open(p).read()
          if "kotlin-android" not in s:
              s = s.replace("apply plugin: 'com.android.application'",
                            "apply plugin: 'com.android.application'\napply plugin: 'kotlin-android'", 1)
              s = re.sub(r"android\s*\{", "android {\n    kotlinOptions { jvmTarget = '21' }", s, count=1)
          if "omnidrop-debug.keystore" not in s:
              s = re.sub(r"android\s*\{", "android {\n    signingConfigs {\n        debug {\n            storeFile file(System.getenv('GITHUB_WORKSPACE') + '/signing/omnidrop-debug.keystore')\n            storePassword 'omnidrop123'\n            keyAlias 'omnidrop'\n            keyPassword 'omnidrop123'\n        }\n    }", s, count=1)
          open(p, "w").write(s)
          print("Patched manifest and gradle")
          PY

      - name: Generate Custom App Icon
        run: |
          if [ -f assets/icon-foreground.svg ] && [ -f assets/icon-background.svg ]; then
            CAP_VERSION=$(node -p "require('./node_modules/@capacitor/core/package.json').version")
            npm install --no-save --no-audit --no-fund --legacy-peer-deps sharp @capacitor/assets "@capacitor/android@$CAP_VERSION"
            node - <<'JS'
          const sharp = require('sharp');
          (async () => {
            const bg = await sharp('assets/icon-background.svg', { density: 400 }).resize(1024, 1024).png().toBuffer();
            const fg = await sharp('assets/icon-foreground.svg', { density: 400 }).resize(1024, 1024).png().toBuffer();
            await sharp(bg).composite([{ input: fg }]).png().toFile('assets/icon-only.png');
            await sharp(fg).png().toFile('assets/icon-foreground.png');
            await sharp(bg).png().toFile('assets/icon-background.png');
            console.log('Icon source images created');
          })().catch((e) => { console.error(e); process.exit(1); });
          JS
            npx capacitor-assets generate --android
          else
            echo "No custom icon found in assets/, using the default icon"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --console=plain > ../gradle-build.log 2>&1 || {
            echo "=========== KEY ERRORS ==========="
            grep -nE "^e: |error:|What went wrong|Execution failed|Caused by|Could not|Unresolved|incompatible" -A3 ../gradle-build.log | head -80
            echo "=========== LAST 40 LINES ==========="
            tail -40 ../gradle-build.log
            exit 1
          }

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnidrop-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
